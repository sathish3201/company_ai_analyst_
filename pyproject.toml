[project]
name = "company-ai-analyst"
version = "0.1.0"
description = "Enterprise Personal Assistant and Dynamic Company Data Analyst"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
 "litellm",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
    "langgraph",
    "langchain",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "integration: tests requiring local infrastructure",
]

[tool.uv]
package = true